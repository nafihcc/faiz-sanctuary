name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web application
        run: |
          npm run build:gh
          cp dist-gh/gh-index.html dist-gh/index.html
        env:
          BASE_PATH: /

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for release
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Shareek-App.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shareek-Android-APK
          path: release-apk/Shareek-App.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "Shareek Android APK (v1.0.0)"
          body: |
            ### 🕌 Shareek (شَرِيك) — Android APK Release
            
            Download the official Android APK for Shareek to access:
            - **Pray First / Khushūʿ Shield**: Distraction-free mobile usage with automated app blocking during prayer times.
            - **Automated Adhan Audio Alerts**: Makkah, Madinah, Al-Aqsa, and Istanbul calls to prayer.
            - **Complete Offline Support**: Prayer times, 604 Quran pages, 99 Names of Allah, and Hisn al-Muslim Adhkar.
            - **Nearby Masajid Radar & Qibla Compass**: Works without web browser chrome.
            
            #### 📱 How to Install:
            1. Download `Shareek-App.apk` below.
            2. Open the file on your Android phone and tap **Install**.
            3. If prompted, allow "Install from this source".
          files: release-apk/Shareek-App.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
