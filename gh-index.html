<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shareek (شَرِيك) — Prayer Times, Quran, Qibla & Daily Worship</title>
    <meta
      name="description"
      content="Prayer times for your exact coordinates and elevation, with Quran reading, Qibla compass, dhikr counter and a daily worship tracker."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.png" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1f2f57" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Amiri+Quran&display=swap"
    />
    <script>
      (function() {
        try {
          var p = window.location.pathname;
          var base = '/faiz-sanctuary/';
          if (p === '/faiz-sanctuary') {
            window.history.replaceState(null, '', base + window.location.search + window.location.hash);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#faf8f5;color:#1f2f57;font-family:system-ui,-apple-system,sans-serif;padding:1.5rem;text-align:center;">
        <div style="width:72px;height:72px;border-radius:24px;background:#ffffff;box-shadow:0 8px 24px rgba(31,47,87,0.08);display:flex;align-items:center;justify-content:center;margin-bottom:1.25rem;">
          <svg viewBox="0 0 100 100" width="46" height="46" fill="none">
            <path d="M50 14 C44 26 30 38 30 54 C30 68 39 80 50 86 C61 80 70 68 70 54 C70 38 56 26 50 14 Z" fill="#2ca57b" opacity="0.9" />
            <path d="M50 8 C49 6 51 6 50 4" stroke="#d4a34b" stroke-width="2.5" stroke-linecap="round" />
            <circle cx="50" cy="4" r="2" fill="#d4a34b" />
            <ellipse cx="50" cy="56" rx="10" ry="16" fill="#faf8f5" opacity="0.95" />
          </svg>
        </div>
        <h1 style="font-size:1.75rem;font-weight:700;margin:0;letter-spacing:-0.02em;">Shareek <span style="font-family:'Amiri Quran',serif;font-weight:400;color:#2ca57b;">شَرِيك</span></h1>
        <p style="margin:0.5rem 0 1.5rem 0;color:#64748b;font-size:0.9rem;">Opening your sacred prayer sanctuary...</p>
        <div style="width:40px;height:4px;border-radius:9999px;background:#e2e8f0;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;bottom:0;width:50%;background:#2ca57b;border-radius:9999px;animation:shareekPulse 1.2s ease-in-out infinite alternate;"></div>
        </div>
        <style>
          @keyframes shareekPulse {
            0% { transform: translateX(-30%); }
            100% { transform: translateX(130%); }
          }
        </style>
        <div id="shareek-stuck-help" style="display:none;margin-top:2rem;">
          <button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}window.location.reload();" style="padding:0.6rem 1.4rem;border-radius:9999px;background:#2ca57b;color:#fff;border:none;font-weight:600;font-size:0.85rem;cursor:pointer;box-shadow:0 4px 12px rgba(44,165,123,0.25);">
            Reset Cache & Reload
          </button>
        </div>
        <script>
          setTimeout(function() {
            var h = document.getElementById('shareek-stuck-help');
            if (h && document.getElementById('root') && document.getElementById('root').querySelector('#shareek-stuck-help')) {
              h.style.display = 'block';
            }
          }, 3500);
        </script>
      </div>
    </div>
    <script type="module" src="/src/gh-main.tsx"></script>
  </body>
</html>
